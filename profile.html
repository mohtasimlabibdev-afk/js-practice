
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Introduction Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="profile.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">

    <main class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

        <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">
            Introduction Generator
        </h1>

        <p class="text-slate-500 text-center mb-6">
            Enter your information to create your profile.
        </p>

        <!-- Input Form -->
        <div class="space-y-4">

            <input
                type="text"
                id="name"
                placeholder="Your Name"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <input
                type="number"
                id="age"
                placeholder="Your Age"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <input
                type="text"
                id="profession"
                placeholder="Your Profession"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <input
                type="text"
                id="hobby"
                placeholder="Your Hobby"
                class="w-full border border-slate-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                id="generateBtn"
                class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700 transition"
            >
                Generate Profile
            </button>

            <button
                id="resetBtn"
                class="w-full bg-slate-200 text-slate-700 font-semibold p-3 rounded-lg hover:bg-slate-300 transition"
            >
                Reset
            </button>

        </div>

        <!-- Error Message -->
        <p id="errorMessage" class="text-red-500 text-sm mt-4"></p>

        <!-- Output Section -->
        <section id="output" class="hidden mt-6 bg-blue-50 p-5 rounded-xl border border-blue-100">

        </section>

    </main>

</body>
</html>
